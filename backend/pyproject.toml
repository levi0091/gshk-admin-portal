[project]
name = "gshk-admin-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "supabase==2.10.0",
    "python-dotenv==1.0.1",
    "pydantic[email]==2.10.3",
    "email-validator==2.3.0",
    "httpx>=0.26,<0.28",
    "alembic==1.14.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.0",
    "reportlab>=5.0.0",
    # RUNTIME, not a test tool: services/nar1_form/fill.py fills CR's blank
    # Form NAR1 with pypdf, and routers/cases.py imports it to render the PDF
    # the client is sent. It sat in the dev group and worked only because
    # `uv sync` installs dev groups by DEFAULT -- any build that passed
    # --no-dev would have shipped an image whose client-verification send
    # raised ImportError on the first real use.
    "pypdf>=6.16.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov",
    "httpx>=0.26,<0.28",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    # Test-only: the field-map tests read CR's specimens with it. Nothing the
    # server does at runtime touches pymupdf.
    "pymupdf>=1.28.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

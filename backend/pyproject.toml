[project]
name = "gshk-admin-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "supabase==2.10.0",
    "python-dotenv==1.0.1",
    "pydantic[email]==2.10.3",
    "email-validator==2.3.0",
    "httpx>=0.26,<0.28",
    "alembic==1.14.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov",
    "httpx>=0.26,<0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Indigo rounded square background -->
  <rect width="32" height="32" rx="7" fill="#242C66"/>

  <!-- G arc: white C-shape, opening right, rounded ends -->
  <path
    d="M 22,9.5 A 8.5,8.5 0 1,0 22,22.5"
    fill="none"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Crossbar: orange flow accent, G's horizontal shelf -->
  <line
    x1="16" y1="16"
    x2="24" y2="16"
    stroke="#F36C32"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>

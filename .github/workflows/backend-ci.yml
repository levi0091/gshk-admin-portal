name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  # Unit tests — supabase client is mocked; no DB or network needed.
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: pytest (mocked)
        run: uv run pytest -q
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: dummy

  # Migration up/down against an ephemeral Postgres, plus greenfield assertions.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gflowdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gflowdesk_test
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      # 001/002 reference Supabase objects (auth.users FK, `authenticated` role).
      # Bootstrap minimal stand-ins so the migrations run on vanilla Postgres.
      - name: Bootstrap Supabase prerequisites
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          # All THREE Supabase roles, not just `authenticated`. Creating one of a
          # set is worse than creating none: a privilege test that guards with
          # "do any of these roles exist?" then stops skipping and queries a role
          # that still does not, which is how migration 039's REVOKE test died
          # with `role "anon" does not exist` and blocked every PROD deploy
          # (Railway waits for CI). With all three present those REVOKE/GRANT
          # assertions actually run, so a migration that published a case view to
          # `anon` would now fail here instead of reaching production.
          for role in anon authenticated service_role; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='$role') THEN CREATE ROLE $role; END IF; END \$\$;"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);"

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: seed + greenfield assertions
        # Globbed (not a hand-maintained list) so a new migration-assertion
        # file — e.g. tests/tpsi/test_migration_016.py, test_migration_020.py —
        # is picked up automatically as it lands. `shopt -s nullglob` makes an
        # empty match vanish from the argument list instead of being passed to
        # pytest as a literal, unmatched "tests/test_migration_*.py" string.
        run: |
          shopt -s nullglob
          uv run pytest -q \
            tests/test_documents_migration_seed.py \
            tests/test_module_permissions_seed.py \
            tests/test_migration_*.py \
            tests/tpsi/test_migration_*.py

      - name: alembic downgrade (reversibility)
        run: uv run alembic downgrade base

name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  # Vitest + RTL — the API layer is mocked; no backend or network needed.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: vitest
        run: npm run test
        env:
          # Unlike the build, tests EXECUTE the modules: lib/api.js constructs the
          # Supabase client at import and throws without these. Locally they come
          # from frontend/.env, which is not committed — so CI must supply them or
          # any test file that imports api.js without mocking it fails to collect.
          # Placeholders only; every test mocks the API and no request is made.
          VITE_API_URL: http://localhost:8000
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key

  # A passing test suite still ships nothing if the bundle won't build.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: vite build
        run: npm run build
        env:
          # Vite inlines env at build time; a placeholder is enough to compile.
          VITE_API_URL: http://localhost:8000
